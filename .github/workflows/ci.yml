name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The range Hermes supports: requires_python >=3.11,<3.14
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Test
        run: python -m pytest

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan sees the tree as published.
          fetch-depth: 0
      - name: Scan tracked files for credential shapes
        run: bash scripts/check-secrets.sh

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t paul-fde-agent:ci .
      - name: Image runs and reports its environment
        # `pfa doctor` exits 2 when the local model backend is absent, which is
        # expected in CI. We assert the CLI runs and produces valid JSON.
        run: |
          docker run --rm paul-fde-agent:ci doctor --json | python3 -c \
            "import json,sys; d=json.load(sys.stdin); assert any(c['name']=='routing policy' for c in d); print(f'{len(d)} checks reported')"
      - name: Compose file is valid
        run: POSTGRES_PASSWORD=ci-placeholder docker compose -f docker/docker-compose.yml config --quiet
